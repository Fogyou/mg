<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>MAELSTROM SYSTEM</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

body {
    margin: 0;
    background: black;
    color: #ff0000;
    font-family: 'Share Tech Mono', monospace;
}


.wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}


.container {
    width: 900px;
    max-height: 90vh;
    overflow-y: auto;
    background: rgba(10,0,0,0.9);
    border: 1px solid rgba(255,0,0,0.3);
    box-shadow: 0 0 40px rgba(255,0,0,0.2);
    padding: 20px;
}


h2 {
    text-align: center;
    margin-bottom: 20px;
    text-shadow: 0 0 10px red;
}


table {
    width: 100%;
    border-collapse: collapse;
}

td, th {
    border-bottom: 1px solid rgba(255,0,0,0.2);
    padding: 8px;
}

input {
    background: transparent;
    border: none;
    border-bottom: 1px solid red;
    color: red;
    width: 100%;
}

button {
    margin-top: 15px;
    width: 100%;
    padding: 10px;
    background: transparent;
    border: 1px solid red;
    color: red;
    cursor: pointer;
}

button:hover {
    background: red;
    color: black;
}


#total {
    margin-top: 15px;
    text-align: center;
    font-size: 20px;
}


.container::-webkit-scrollbar {
    width: 6px;
}
.container::-webkit-scrollbar-thumb {
    background: red;
}

@keyframes glitch {
    0% { transform: translate(0); }
    50% { transform: translate(-1px,1px); }
    100% { transform: translate(1px,-1px); }
}

.glitch {
    animation: glitch 0.2s infinite;
}
</style>
</head>

<body>

<div class="wrapper">
<div class="container">

<h2 class="glitch">MAELSTROM</h2>

<table id="table">
<thead>
<tr>
<th>Название</th>
<th>Цена</th>
<th>Кол-во</th>
<th>Сумма</th>
</tr>
</thead>
<tbody></tbody>
</table>

<h2 id="total">Общая сумма: 0</h2>
<button onclick="addRow()">+ ДОБАВИТЬ</button>

</div>
</div>

<script>
let items = JSON.parse(localStorage.getItem("maelstrom_items")) || [
["Сёрфер (3 дека)",200000,0],
["Волновод (2 дека)",100000,0],
["Второе сердце",150000,0],
["Лодыжки (прыжки)",60000,0],
["Рывок",60000,0],
["Глитч (юзлес)",50000,0],
["Кироши 2 (Теплак)",50000,0],
["Синт легкие",20000,0],
["Смоук",20000,0],
["Рипердрайв 3",15000,0],
["Регулятор боли",15000,0],
["Титановые кости",15000,0],
["Кироши 1 (юзлес)",15000,0],
["Рипердрайв 2",10000,0],
["Патроны Масамуне (60)",2400,0],
["Патроны Шинген (60)",1200,0],
["Патроны таямура/кенши/тсунами",600,0],
["Ремка для имплантов",2000,0],
["Имунки",250,0]
];

function save(){
localStorage.setItem("maelstrom_items", JSON.stringify(items));
}

function render(){
let tbody=document.querySelector("#table tbody");
tbody.innerHTML="";
let total=0;

items.forEach((item,i)=>{
let sum=item[1]*item[2];
total+=sum;

tbody.innerHTML+=`
<tr>
<td><input value="${item[0]}" onchange="update(${i},0,this.value)"></td>
<td><input type="number" value="${item[1]}" onchange="update(${i},1,this.value)"></td>
<td><input type="number" value="${item[2]}" onchange="update(${i},2,this.value)"></td>
<td>${sum}</td>
</tr>`;
});

document.getElementById("total").innerText="Общая сумма: "+total;
save();
}

function update(i,f,v){
if(f===1||f===2) v=parseInt(v)||0;
items[i][f]=v;
render();
}

function addRow(){
items.push(["Новый имплант",0,0]);
render();
}

render();


setInterval(()=>{
document.querySelector(".container").style.transform=
`translate(${Math.random()*2-1}px,${Math.random()*2-1}px)`;
setTimeout(()=>document.querySelector(".container").style.transform="none",50);
},4000);
</script>

</body>
</html>
